name: library
services:
  db:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U library -d library']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    networks: [backend]
  migrate:
    image: ${APP_IMAGE:-library-api:local}
    build: .
    command: [python, -m, alembic, upgrade, head]
    environment:
      DATABASE_URL: postgresql+psycopg://library:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/library
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
  app:
    image: ${APP_IMAGE:-library-api:local}
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://library:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/library
      APP_ENV: staging
      APP_VERSION: ${APP_VERSION:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    networks: [backend]
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
    networks: [backend]
volumes:
  db-data:
networks:
  backend:
