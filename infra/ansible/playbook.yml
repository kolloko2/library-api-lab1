- name: Configure library nodes
  hosts: all
  become: true
  tasks:
    - name: Require private configuration and trusted administrative key
      ansible.builtin.assert:
        that:
          - library_db_password | length >= 24
          - library_admin_public_key | length > 100
        quiet: true
      no_log: true
    - name: Install packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, python3, python3-venv, iptables, iptables-persistent]
        update_cache: true
        cache_valid_time: 3600
        state: present
    - name: Configure backend network
      ansible.builtin.include_tasks: tasks/network.yml
    - name: Manage administrative account
      ansible.builtin.user:
        name: devops
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
    - name: Create administrator key directory
      ansible.builtin.file:
        path: /home/devops/.ssh
        state: directory
        owner: devops
        group: devops
        mode: '0700'
    - name: Install trusted administrative key
      ansible.builtin.copy:
        content: '{{ library_admin_public_key }}'
        dest: /home/devops/.ssh/authorized_keys
        owner: devops
        group: devops
        mode: '0600'
    - name: Configure SSH
      ansible.builtin.copy:
        src: ../sshd-library.conf
        dest: /etc/ssh/sshd_config.d/library.conf
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
    - name: Create service user
      ansible.builtin.user:
        name: library
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Create configuration directory
      ansible.builtin.file:
        path: /etc/library
        state: directory
        owner: root
        group: library
        mode: '0750'
    - name: Render firewall rules
      ansible.builtin.template:
        src: firewall.v4.j2
        dest: /etc/iptables/library.v4
        mode: '0600'
      notify: Apply firewall
    - name: Install firewall apply command
      ansible.builtin.copy:
        src: ../library-firewall.sh
        dest: /usr/local/sbin/library-firewall
        mode: '0755'
      notify: Apply firewall
    - name: Install firewall service
      ansible.builtin.copy:
        src: ../library-firewall.service
        dest: /etc/systemd/system/library-firewall.service
        mode: '0644'
      notify: Apply firewall
    - name: Enable managed firewall
      ansible.builtin.systemd_service:
        name: library-firewall
        daemon_reload: true
        enabled: true
        state: started
    - name: Configure PostgreSQL node
      ansible.builtin.include_tasks: tasks/database.yml
      when: inventory_hostname in groups['database']
    - name: Apply database and firewall configuration before application setup
      ansible.builtin.meta: flush_handlers
    - name: Configure Docker host
      ansible.builtin.include_tasks: tasks/docker.yml
      when: inventory_hostname in groups['app']
    - name: Configure application runtime
      ansible.builtin.include_tasks: tasks/application.yml
      when: inventory_hostname in groups['app']
    - name: Apply configuration changes
      ansible.builtin.meta: flush_handlers
    - name: Verify application health
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/health
        status_code: 200
      when: inventory_hostname in groups['app']
      register: health
      retries: 5
      delay: 2
      until: health.status == 200
  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
    - name: Apply firewall
      ansible.builtin.systemd_service:
        name: library-firewall
        daemon_reload: true
        state: restarted
    - name: Restart application
      ansible.builtin.systemd_service:
        name: library
        state: restarted
        daemon_reload: true
